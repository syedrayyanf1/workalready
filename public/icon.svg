<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="caxis-bg" x1="16" y1="0" x2="16" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#27272A" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <linearGradient id="caxis-mark" x1="2" y1="4" x2="30" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#A1A1AA" />
    </linearGradient>
  </defs>
  <!-- Dark Matte Squircle Background -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" fill="url(#caxis-bg)" stroke="rgba(255,255,255,0.16)" stroke-width="1" />
  <!-- Geometric C Arc on Left -->
  <path
    d="M 12.5 10.65 A 6.25 6.25 0 1 0 12.5 21.35"
    stroke="url(#caxis-mark)"
    stroke-width="3.5"
    stroke-linecap="round"
  />
  <!-- Center Coordinate Axis Crosshair (+) -->
  <path
    d="M 16 5.5 L 16 26.5 M 12.5 16 L 19.25 16"
    stroke="url(#caxis-mark)"
    stroke-width="1.75"
    stroke-linecap="round"
    opacity="0.9"
  />
  <!-- Sharp Geometric X on Right -->
  <path
    d="M 20.75 10.25 L 28.5 21.75 M 28.5 10.25 L 20.75 21.75"
    stroke="url(#caxis-mark)"
    stroke-width="3.5"
    stroke-linecap="round"
  />
</svg>
